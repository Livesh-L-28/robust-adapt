name: CI / Production Quality Pipeline

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-format:
    name: Linting & Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy
      - name: Run Ruff Lint Check
        run: |
          ruff check adaptive_ml tests
      - name: Run Ruff Format Check
        run: |
          ruff format --check adaptive_ml tests

  test-matrix:
    name: Test Matrix (${{ matrix.os }} - Python ${{ matrix.python-version }})
    needs: lint-and-format
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Core Package & Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,all]
      - name: Execute Full Pytest Test Suite
        run: |
          pytest -v tests/

  package-build-and-verify:
    name: Package Build & Artifact Inspection
    needs: test-matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Build Tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine
      - name: Build Wheel & Source Distribution
        run: |
          python -m build
      - name: Check Artifact Metadata with Twine
        run: |
          twine check dist/*
      - name: Verify Clean Wheel Installation in Isolated Environment
        run: |
          python -m venv test_env
          test_env/bin/pip install dist/*.whl
          test_env/bin/python -c "import adaptive_ml; print('AdaptiveML version:', adaptive_ml.__version__)"
          test_env/bin/python -c "from adaptive_ml.ala import AdaptiveClassifier; clf = AdaptiveClassifier(4, 2); print('ALA initialized successfully')"
