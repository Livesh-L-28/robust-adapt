name: Security & Supply Chain Audit

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    - cron: '0 0 * * 1'  # Weekly on Monday

permissions:
  contents: read

jobs:
  security-audit:
    name: Dependency Vulnerability & Secret Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit bandit
      - name: Run Bandit AST Security Scan
        run: |
          # Audit for unsafe deserialization (pickle), hardcoded passwords, or eval
          bandit -r adaptive_ml -ll -ii
      - name: Run Pip-Audit Dependency Scan
        run: |
          pip-audit --desc

