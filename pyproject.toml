[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aml-core"
version = "0.1.0.dev0"
description = "Adaptive, Robust, and Resource-Efficient Learning Library"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    { name = "AdaptiveML Core Development Team", email = "maintainers@adaptiveml.internal" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

# Core mandatory runtime dependencies: strictly minimal
dependencies = [
    "numpy>=1.24.0",
]

[project.optional-dependencies]
torch = [
    "torch>=2.0.0",
]
sklearn = [
    "scikit-learn>=1.2.0",
    "scipy>=1.10.0",
]
safetensors = [
    "safetensors>=0.4.0",
]
dataframe = [
    "pandas>=1.5.0",
    "polars>=0.18.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "hypothesis>=6.80.0",
    "mypy>=1.5.0",
    "ruff>=0.1.0",
]
benchmarks = [
    "psutil>=5.9.0",
]
all = [
    "torch>=2.0.0",
    "scikit-learn>=1.2.0",
    "scipy>=1.10.0",
    "safetensors>=0.4.0",
    "psutil>=5.9.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["adaptive_ml*"]

[tool.setuptools.package-data]
adaptive_ml = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true

